[package]
name = "snodra-conformance-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "The reference conformance service on snodra-messaging-rs: the runner's fixture and the example for library authors"
license = "Apache-2.0"
publish = false

[[bin]]
name = "conformance-reference-service"
path = "src/main.rs"

[dependencies]
# snodra-messaging-rs from crates.io, at the minor the runner tests: the reference service is also the
# example for library authors, so it takes the artifact a stranger would.
snodra-messaging-rs = "0.7"
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
