[package]
name = "snodra-conformance-reference"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "The reference conformance service on snodra-messaging: the runner's fixture and the example for library authors"
license = "Apache-2.0"
publish = false

[[bin]]
name = "conformance-reference-service"
path = "src/main.rs"

[dependencies]
# snodra-messaging from crates.io, at the release the runner tests (0.7.1 at least: it sends the
# caller's full timeout on every hop): the reference service is also the example for library authors,
# so it takes the artifact a stranger would.
snodra-messaging = "0.8.0"
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
