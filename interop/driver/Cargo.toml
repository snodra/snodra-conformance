[package]
name = "snodra-interop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "The interoperability driver: services built on different Snodra libraries talk to each other through one real hub"
license = "Apache-2.0"
publish = false

[[bin]]
name = "snodra-interop"
path = "src/main.rs"

[dependencies]
snodra-conformance = { path = "../.." }
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.6.7", features = ["derive"] }
