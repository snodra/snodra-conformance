[package]
name = "snodra-conformance"
version = "0.4.1"
edition = "2024"
rust-version = "1.99"
description = "The Snodra conformance runner: proves a client library's feature level against a real Snodra Server and fake hubs"
license = "Apache-2.0"
publish = false

# The runner, the reference conformance service (on snodra-messaging), the violator and the
# cross-language interoperability driver.
[workspace]
members = [".", "reference-service", "violator", "interop/driver"]

[lib]
name = "snodra_conformance"

[[bin]]
name = "snodra-conformance"
path = "src/main.rs"

[dependencies]
# The runner speaks hub.proto itself (raw frames), as snodra-server's own tests do: it never links a
# Snodra library, so it can observe and violate the protocol where a check needs it.
tonic = { version = "0.14.8", features = ["tls-ring"] }
tonic-prost = "0.14.8"
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4.6.7", features = ["derive"] }
# The checks of caller identity (L1-IDENTITY, L1-PROPAGATION): the runner is the token issuer, with
# an RSA key made at start and a JWKS endpoint of its own.
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rsa = "0.9"
base64 = "0.23"
rand = "0.8"
# L1-TLS: the fake hub serves TLS with a CA the runner makes at start.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
# The fake hub's TLS uses ring, named explicitly: another dependency (testcontainers, in tests) may
# enable a second rustls provider, and rustls then cannot pick one by itself.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Validity periods of the certificates the runner issues (L1-MTLS).
time = "0.3"

[build-dependencies]
tonic-prost-build = "0.14.8"
prost-build = "0.14.4"
# A protoc per build host, so a cross-compiled release needs no system package.
protoc-bin-vendored = "3.3"

[dev-dependencies]
testcontainers = "0.27"

# RSA key generation is slow unoptimised; the runner makes one key per run.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
